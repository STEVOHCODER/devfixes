<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevFixes</title>
    <meta name="description" content="Developer error guides, searchable tutorials, and interactive debugging labs." />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #080c0f; color: #f4f7f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, #123327 0, transparent 35%), #080c0f; }
      main { width: min(880px, calc(100% - 40px)); padding: 72px 0; }
      small { color: #4ee3a1; font: 700 12px ui-monospace, monospace; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 22px 0; font-size: clamp(44px, 9vw, 88px); line-height: .98; }
      p { max-width: 680px; color: #aab5bc; font-size: 18px; line-height: 1.8; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
      a { padding: 14px 18px; border: 1px solid #28333a; border-radius: 8px; color: #f4f7f8; text-decoration: none; font-weight: 700; }
      a:first-child { background: #4ee3a1; border-color: #4ee3a1; color: #04110b; }
    </style>
  </head>
  <body>
    <main>
      <small>DevFixes developer platform</small>
      <h1>Errors in. Answers out.</h1>
      <p>Search practical error guides, publish Markdown tutorials through the content studio, and practice fixes in guided or isolated debugging labs.</p>
      <nav>
        <a href="https://devfixes.vercel.app">Open DevFixes</a>
        <a href="https://github.com/STEVOHCODER/devfixes">View source</a>
        <a href="https://github.com/STEVOHCODER/devfixes/blob/master/docs/TUTORIAL_PUBLISHING.md">Publishing guide</a>
      </nav>
    </main>
  </body>
</html>
